[project]
name = "attune-mixer"
# ONE source of truth for the version: the VERSION file at the repo root. The installer
# script, desktop/build_installer.py and tools/make_release.py all read that same file.
# Never type a version number into this file or any other.
dynamic = ["version"]
description = "Local-first acoustic playlist generator - a modern successor to MusicIP Mixer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["music", "playlist", "acoustic-similarity", "musicip", "librosa",
            "self-hosted", "plex", "jellyfin", "mfcc", "local-first"]
authors = [{ name = "Joe Schmidt" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Private :: Do Not Upload",
]
dependencies = [
    "librosa>=0.11,<0.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    # Core, not an extra: src/scan.py reads every tag with it, src/features.py asks it
    # for a container's claimed length, and src/plexmatch.py uses it to check a match.
    # A core install without it cannot import a library. GPL-2.0-or-later, which is what
    # makes the built application GPL-3.0-or-later; see NOTICE.md section 3.
    "mutagen>=1.47",
]

# NOT PUBLISHED TO PyPI for this release. The name "attune-mixer" is not registered and no
# upload is planned this release; the supported way to get Attune is the Windows
# installer or the portable zip from the GitHub Releases page. This file exists so the
# source tree is installable for development and so the dependency set is declared
# honestly in one place. The "Private :: Do Not Upload" classifier above makes PyPI
# reject an accidental upload.
# (The SPDX license string and license-files replace the older license table and the
# "License :: OSI Approved" classifier, both of which setuptools deprecates.)

# Optional feature sets. The core install above runs the standalone librosa engine only.
#   pip install -e .[app]       -> the desktop app and its web UI (what the installer ships)
#   pip install -e .[neural]    -> hybrid CLAP engine (embed.py + hybrid.py), needs torch
#   pip install -e .[bridge]    -> the LAN web UI over a live MusicIP
#   pip install -e .[learned]   -> ONNX inference: the distilled-metric engine
#                                  (--engine learned) AND the torch-free CLAP embedder
#                                  (embed_onnx.py); keeps the runtime torch-free
#   pip install -e .[dev]       -> the test suite
#   pip install -e .[all]
# torch is intentionally unpinned: install the right CPU/CUDA build from pytorch.org first.
[project.optional-dependencies]
app = ["flask>=3.0", "requests>=2.31", "pywebview>=5", "watchdog>=6",
       "onnxruntime>=1.20"]
neural = ["torch", "transformers>=4.40"]
bridge = ["flask>=3.0", "watchdog>=6"]
learned = ["onnxruntime>=1.20"]
dev = ["pytest>=8"]
all = ["flask>=3.0", "requests>=2.31", "pywebview>=5", "watchdog>=6",
       "onnxruntime>=1.20", "torch", "transformers>=4.40"]

[project.scripts]
attune-scan   = "scan:main"      # import/analyze a library -> mixer.db
attune-embed  = "embed:main"     # optional CLAP embeddings (needs [neural])
attune-embed-onnx = "embed_onnx:main"  # torch-free CLAP embeddings (needs [learned])
attune-mix    = "mixer:main"     # librosa engine (core, no neural deps)
attune-hybrid = "hybrid:main"    # hybrid V2 engine (needs [neural] + a clap table)

[project.urls]
Homepage = "https://github.com/Maestro8484/attune"
Issues = "https://github.com/Maestro8484/attune/issues"

# External program, not a Python dependency: ffmpeg.
#   - tags are read with mutagen (src/scan.py), which is why ffprobe is no longer needed
#     and is no longer shipped; scan.py falls back to ffprobe only if mutagen cannot open
#     a file at all, so a machine without it loses nothing it had.
#   - the analyzer falls back to ffmpeg for what libsndfile cannot decode: m4a, aac and
#     wma always, and a damaged file of any format (measured 2026-09-20, 22 of a random
#     300 mp3 files from a real library).
# Only needed when installing FROM SOURCE. The shipped Windows app BUNDLES ffmpeg.exe
# inside its analyzer (desktop/build.py FFBIN), so a user installs nothing.
# Install: https://ffmpeg.org/download.html (or winget install ffmpeg / brew install
# ffmpeg / apt install ffmpeg). ffmpeg is LGPL/GPL and is used as a separate program,
# never linked into this codebase.

[build-system]
requires = ["setuptools>=77"]   # 77 is where the SPDX `license` string above is supported
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools]
package-dir = { "" = "src" }
# Every module under src/, listed explicitly. src/ is a flat set of modules, not
# packages, so setuptools' automatic discovery does not find them; the previous list
# named 9 of the 20 that exist, which meant `pip install -e .` produced an installation
# missing half the product, including the engine the app actually runs. Adding a file to
# src/ means adding it here. Checked with:
#   python -c "import glob,os;print(sorted(os.path.basename(p)[:-3] for p in glob.glob('src/*.py')))"
py-modules = [
    "config", "db", "embed", "embed_onnx", "engine", "exp_run", "export",
    "features", "features_exp", "genre_cluster", "hybrid", "make_validation_set",
    "mixer", "musicip_engine", "plexmatch", "plexsync", "scan", "textsearch",
    "tune", "validate",
]
