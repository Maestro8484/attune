# Attune CI. One job, on Windows, because Windows is the only platform Attune ships on.
name: CI

on:
  # Both triggers on purpose. `push` on every branch means a branch that has no pull
  # request still gets checked; `pull_request` means a fork's pull request gets checked
  # too. A same-repo pull request therefore runs twice, and the two runs are in different
  # concurrency groups so neither cancels the other. That is accepted: runner minutes are
  # free on a public repository, and the alternative leaves one of the two cases uncovered.
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # tools/leak_check.py prints a preview of every line it flags. A Windows runner's piped
  # stdout is cp1252, so one character outside that code page turns the report into a
  # UnicodeEncodeError traceback instead of a verdict. Observed locally, 2026-09-20.
  PYTHONUTF8: "1"

jobs:
  test:
    name: tests + leak check (windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Nothing here uses Git LFS any more. src/models/clap_music.onnx used to be
          # a 276 MB LFS object; it is now gitignored entirely and published as a
          # release asset, fetched with `python tools/fetch_model.py`. CI deliberately
          # does not fetch it: no test in tests/ loads the model, so downloading a
          # quarter of a gigabyte on every push and pull request would buy nothing.
          # lfs: false is kept as an explicit statement rather than a default.
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The three installs are three separate steps ON PURPOSE. A `run:` block on Windows
      # is executed by pwsh, which the runner wraps so that only the LAST line's exit code
      # becomes the step's result. Native programs like pip do not trip
      # $ErrorActionPreference, so a failed install followed by a successful one would
      # have read as a green step. Caught in review. One command per step, one exit code
      # per step.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install the analysis core
        run: pip install -r requirements.txt

      - name: Install the packages the tests need
        # NOT `pip install -e .[app]`: that pulls pywebview and pythonnet, which exist to
        # open a desktop window and have no business on a headless runner. torch is never
        # installed; nothing in tests/ needs it.
        run: pip install flask mutagen requests watchdog pytest

      - name: Confirm the optional test dependencies really imported
        # tests/test_bridge_dest_ok.py calls pytest.skip() when it cannot import
        # bridge/bridge.py, which it cannot do without Flask. A silent skip would
        # turn a missing dependency into a green run that proved nothing, so the
        # import is checked here where failing is unambiguous.
        run: python -c "import flask, mutagen, requests, watchdog; print('ok')"

      - name: Check that the package metadata still installs
        # pyproject.toml names every module under src/ by hand and reads its version from
        # the VERSION file. Neither is exercised by any test, so both would drift silently
        # the next time a file lands in src/. --no-deps because everything needed is
        # already installed above; this step is about the metadata, not the dependencies.
        run: |
          pip install -e . --no-deps
      - name: Confirm the installed package exposes its modules
        run: python -c "import config, db, engine, hybrid, export, plexmatch, scan; print('package ok')"

      - name: Run the test suite
        # -rs lists every skipped test with its reason, so a suite that quietly
        # stopped covering something shows up in the log.
        run: python -m pytest tests -q -rs --junitxml=${{ runner.temp }}/junit-all.xml

      - name: Fail if the bridge security tests skipped
        # tests/test_bridge_dest_ok.py skips itself whenever it cannot import
        # bridge/bridge.py, for ANY reason: a missing package, a syntax error, a
        # SystemExit from a config check. pytest exits 0 on an all-skipped file, so
        # without this a broken bridge module reads as a green run that tested nothing.
        # The junit report from the step above is read rather than the human output,
        # because it carries a machine-readable skip count.
        # The other 40 skips in this suite are tests/test_key_compat.py cross-checking
        # against a research module that lives outside this repository and is expected to
        # be absent here; they are not covered by this check.
        run: >
          python -c "import sys, xml.etree.ElementTree as ET;
          cases = [c for c in ET.parse(r'${{ runner.temp }}/junit-all.xml').getroot().iter('testcase') if 'test_bridge_dest_ok' in (c.get('file') or c.get('classname') or '')];
          skipped = [c for c in cases if c.find('skipped') is not None];
          print(f'bridge tests: {len(cases)} collected, {len(skipped)} skipped');
          sys.exit(0) if cases and not skipped else sys.exit('bridge security tests did not run; see the skip reason in the step above')"

      - name: Scan for personal data
        # tools/leak_check.py, generic patterns only. The maintainer's machine-specific
        # literals live in a gitignored .leakpatterns file that is absent here by
        # design, so this step covers the two built-in patterns (any email address, any
        # C:\Users\<name> path) and nothing more. The full check, with the private
        # pattern file and a pickaxe over git history, is a local pre-push step; this
        # is the part that can be automated without publishing anyone's personal
        # strings to a public workflow log.
        run: python tools/leak_check.py .

# Not done here, on purpose: building the installer. The only environment that has ever
# produced a working frozen Attune is the maintainer's PC (see
# desktop/requirements-build.txt). A second build environment is a second thing to debug,
# and this release does not need one. Releases are cut locally with tools/make_release.py.
